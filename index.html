<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PrevenciónPro Chile</title>
    <meta name="description" content="Gestión de Prevención de Riesgos Laborales bajo Ley 16.744, DS 40, DS 594 y Protocolos MINSAL." />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PrevenciónPro" />
    <meta name="application-name" content="PrevenciónPro Chile" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      // Aplica el tema guardado antes de pintar (evita destello claro en Modo Oscuro Terreno)
      try {
        var t = localStorage.getItem('prevencionpro-chile:tema');
        if (t === 'oscuro' || t === 'hse') {
          document.documentElement.dataset.theme = t;
          if (t === 'oscuro') document.documentElement.style.colorScheme = 'dark';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
